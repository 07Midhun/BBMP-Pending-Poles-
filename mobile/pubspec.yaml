name: bbmp_pending_poles
description: "A Flutter mobile application for filtering, distance-based ordering, and locating BBMP pending poles."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.5
  http: ^1.2.0
  google_fonts: ^6.1.0
  image_picker: ^1.2.0
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
